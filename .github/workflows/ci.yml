name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: the version the project is developed on; its npm writes the
      # lockfile, so CI must resolve it with the same npm generation.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # Browser smoke test against the production build. Without an RPC key
      # the live checks fall back gracefully and the deep-link block skips.
      - name: e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 1
          done
          npm run e2e
